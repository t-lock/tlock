    <script>
      const W = 680,
        H = 420;

      const vert = `attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
      const frag = `
  precision mediump float;
  uniform vec2 iResolution;
  uniform float iTime;

  vec3 hueShift(vec3 c, float a){
    const vec3 k = vec3(0.57735);            // 1/sqrt(3)
    float ct = cos(a), st = sin(a);
    return c*ct + cross(k,c)*st + k*dot(k,c)*(1.0-ct);
  }

  void main(){
    vec2 fc = gl_FragCoord.xy;
    vec2 uv = (2.0*fc - iResolution)/min(iResolution.x, iResolution.y);

    for(float i=1.0; i<8.0; i++){
      uv.y += i*0.1/i * sin(uv.x*i*i + iTime*0.5) * sin(uv.y*i*i + iTime*0.01);
    }

    float v = uv.y*0.6;

    vec3 col;
    col.r = v - 0.1;
    col.g = v + 0.3;
    col.b = v + 0.95;

    col = hueShift(col, 2.9);

    gl_FragColor = vec4(col, 1.0);
  }`;

      function initShader(canvas) {
        canvas.width = W;
        canvas.height = H;
        const gl = canvas.getContext("webgl");
        if (!gl) return;

        function mkS(t, s) {
          const sh = gl.createShader(t);
          gl.shaderSource(sh, s);
          gl.compileShader(sh);
          return sh;
        }
        const prog = gl.createProgram();
        gl.attachShader(prog, mkS(gl.VERTEX_SHADER, vert));
        gl.attachShader(prog, mkS(gl.FRAGMENT_SHADER, frag));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
          gl.STATIC_DRAW,
        );
        const al = gl.getAttribLocation(prog, "a");
        gl.enableVertexAttribArray(al);
        gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
        const ru = gl.getUniformLocation(prog, "iResolution");
        const tu = gl.getUniformLocation(prog, "iTime");

        let t0 = null;
        function frame(ts) {
          if (!t0) t0 = ts;
          gl.viewport(0, 0, W, H);
          gl.uniform2f(ru, W, H);
          gl.uniform1f(tu, (ts - t0) / 1000);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      document.querySelectorAll("canvas.glcanvas").forEach(initShader);
    </script>
